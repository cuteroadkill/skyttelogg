name: "💡 Idé / önskemål"
description: "Förslag på något nytt i appen, eller en förbättring av något som redan finns"
title: "[Idé]: "
labels: ["enhancement"]
body:
  - type: input
    id: version
    attributes:
      label: Vilken version kör du? (valfritt)
      description: Fylls i automatiskt om du kommer hit via appen. Står annars längst ned under Meny.
      placeholder: Står längst ned under Meny
    validations:
      required: false

  - type: textarea
    id: what
    attributes:
      label: Vad vill du kunna göra?
      placeholder: T.ex. "Jag skulle vilja kunna filtrera Senaste-listan på vapentyp"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Varför skulle det vara bra? (valfritt)
      description: Hjälper till att förstå vad problemet egentligen är - ibland finns en enklare lösning än den man själv tänkt sig.
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Hur viktigt är det för dig?
      options:
        - Skulle vara kul att ha
        - Ganska användbart
        - Skulle verkligen behöva det
    validations:
      required: false
